# Автотесты при каждом push и pull request.
# Нейросети в тестах «поддельные» (tests/conftest.py), поэтому torch не ставится.
# Хранилище и сквозные сценарии гоняются на SQLite (как локально) и на настоящем Postgres
# (как на сайте с Supabase) — версии 15 и 17, на них работают проекты Supabase.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }}, SQLite + Postgres ${{ matrix.postgres }}, модели — поддельные)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:  # Postgres 15 и 17 — как в Supabase; Python 3.14 — как на Streamlit Cloud
          - {python: "3.11", postgres: "15"}
          - {python: "3.11", postgres: "17"}
          - {python: "3.14", postgres: "17"}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres  # одноразовый контейнер только для тестов
          POSTGRES_DB: wastewise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wastewise_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest -q
