# Автотесты при каждом push и pull request.
# Нейросети в тестах «поддельные» (tests/conftest.py), поэтому torch не ставится — прогон ~1 мин.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (модели — поддельные, без torch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest -q
