[theme]
# Акцентный цвет — кнопки, ссылки и т.п.
primaryColor = "#2E7D32"             # тёмно-зелёный (Material Green 800)
# Фон сайдбара
backgroundColor = "#eefbefff"          # очень светло-зелёный (Material Green 50)
# Основной фон страницы
secondaryBackgroundColor = "#e2f0f9ff" # светло-серый-голубой (Blue Grey 50)
# Цвет текста
textColor = "#263238"                # очень тёмно-синий-серый (Blue Grey 900)
# Шрифт
font = "sans serif"