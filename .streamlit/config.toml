[theme]
# Палитра совпадает с core/ui.py и с презентацией проекта.
primaryColor = "#2F9E68"             # акцент: кнопки, ссылки, выделения
backgroundColor = "#F7F6F1"          # основной фон страницы (тёплый белый)
secondaryBackgroundColor = "#ECEFE9" # поля ввода, вкладки, таблицы
textColor = "#102A1E"                # текст (почти чёрный зелёный)
font = "sans serif"
